<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Grid Runner — Pit Lane Trading</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070e;--surface:#0e0e1a;--panel:#151524;--panel-h:#1d1d32;
  --border:#262642;--border-h:#3b3b64;--text:#e4e6f2;--dim:#7a82a4;--muted:#3c3f5c;
  --formula:#e63946;--endurance:#4895ef;--rally:#57cc99;--touring:#ff9500;--drag:#ffd60a;--gt:#9b5de5;
  --success:#57cc99;--warn:#ff9500;--danger:#e63946;--info:#4895ef;--gold:#ffd700;--silver:#c0c0c0;--bronze:#cd7f32;
  --font-h:'Rajdhani',sans-serif;--font-m:'JetBrains Mono',monospace;--font-b:'Inter',sans-serif;
  --hdr:62px;--nav:180px;--ticker:36px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-b);font-size:14px;overflow:hidden;height:100vh}
button{cursor:pointer;border:none;font-family:inherit;transition:all .15s}
input{font-family:inherit;outline:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border-h);border-radius:3px}

/* HEADER */
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);background:rgba(14,14,26,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;z-index:100}
#logo-wrap{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer}
#logo-badge{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--formula);box-shadow:0 0 12px rgba(230,57,70,0.4)}
#logo-text{display:flex;flex-direction:column}
#logo-title{font-family:var(--font-h);font-size:17px;font-weight:700;letter-spacing:1.5px;background:linear-gradient(135deg,var(--formula),var(--drag));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.1}
#logo-sub{font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.hsep{width:1px;height:32px;background:var(--border)}
.hstat{display:flex;flex-direction:column;align-items:center;min-width:85px}
.hstat .lbl{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:4px}
.hstat .val{font-family:var(--font-m);font-size:15px;font-weight:500}
#city-badge{display:flex;align-items:center;gap:8px;padding:5px 12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;font-family:var(--font-h);font-size:14px;font-weight:600}
#ap-bar{display:flex;gap:5px;align-items:center;background:rgba(21,21,36,0.7);padding:4px 8px;border-radius:6px;border:1px solid var(--border)}
.ap-pip{width:12px;height:12px;border-radius:50%;background:var(--border);transition:all .2s}
.ap-pip.on{background:var(--drag);box-shadow:0 0 8px var(--drag)}
#wk-badge{font-family:var(--font-m);font-size:11px;color:var(--dim);background:var(--panel);border:1px solid var(--border);padding:4px 10px;border-radius:6px}
.hright{margin-left:auto;display:flex;align-items:center;gap:8px}
.rep-track{width:68px;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.rep-fill{height:100%;background:linear-gradient(90deg,var(--info),var(--success));border-radius:3px;transition:width .4s}

/* LAYOUT */
#layout{display:flex;margin-top:var(--hdr);height:calc(100vh - var(--hdr) - var(--ticker))}
#sidebar{width:var(--nav);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px 8px;gap:4px}
.nb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:transparent;color:var(--dim);font-family:var(--font-h);font-size:14px;font-weight:600;letter-spacing:.5px;text-align:left;border:1px solid transparent;width:100%}
.nb:hover{background:var(--panel);color:var(--text);border-color:var(--border)}
.nb.active{background:var(--panel-h);color:var(--text);border-color:var(--border-h)}
.nb .ico{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nb .ico svg{width:100%;height:100%}
.ndiv{height:1px;background:var(--border);margin:8px 0}
#etb{margin-top:auto;padding:11px;border-radius:8px;background:linear-gradient(135deg,#122518,#0a2012);color:var(--success);font-family:var(--font-h);font-size:14px;font-weight:700;letter-spacing:1px;border:1px solid rgba(87,204,153,0.4);width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
#etb:hover{background:var(--success);color:var(--bg);box-shadow:0 0 18px rgba(87,204,153,.3)}
#content{flex:1;overflow-y:auto;padding:22px}
.tp{display:none}.tp.active{display:block}

/* TICKER */
#ticker{position:fixed;bottom:0;left:0;right:0;height:var(--ticker);background:var(--surface);border-top:1px solid var(--border);overflow:hidden;display:flex;align-items:center;z-index:90}
.tkinner{display:flex;gap:48px;white-space:nowrap;animation:tscroll 50s linear infinite}
.tkinner:hover{animation-play-state:paused}
.tki{font-family:var(--font-m);font-size:11px;color:var(--dim);padding:0 8px;display:inline-flex;align-items:center;gap:6px}
.tki.up{color:var(--success)}.tki.dn{color:var(--danger)}.tki.ev{color:var(--warn)}
@keyframes tscroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* COMMON UI */
.ph{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
.pt{font-family:var(--font-h);font-size:23px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:10px}
.ps{font-size:12px;color:var(--dim);margin-top:2px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}
.ct{font-family:var(--font-h);font-size:15px;font-weight:700;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:8px}

/* HERO BANNER */
.hero-banner{position:relative;border-radius:12px;overflow:hidden;margin-bottom:18px;border:1px solid var(--border);background:#000;display:flex;align-items:center;min-height:115px}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.35;filter:contrast(1.15) saturate(1.1)}
.hero-grad{position:absolute;inset:0;background:linear-gradient(90deg, rgba(7,7,14,0.92) 0%, rgba(7,7,14,0.65) 60%, rgba(7,7,14,0.3) 100%)}
.hero-content{position:relative;z-index:2;padding:18px 24px;max-width:70%}
.hero-tag{font-family:var(--font-h);font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--drag);text-transform:uppercase;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.hero-title{font-family:var(--font-h);font-size:22px;font-weight:700;letter-spacing:1px;color:#fff;line-height:1.2}
.hero-desc{font-size:12px;color:var(--dim);margin-top:4px;line-height:1.4}
.hero-side{position:relative;z-index:2;margin-left:auto;padding-right:24px;display:flex;gap:16px;align-items:center}

/* MARKET */
.mc{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.fb{padding:5px 13px;border-radius:20px;background:var(--panel);color:var(--dim);border:1px solid var(--border);font-family:var(--font-h);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fb:hover,.fb.a{color:var(--text);border-color:var(--border-h);background:var(--panel-h)}
.fb .fbi{width:14px;height:14px}
.mtbl{width:100%;border-collapse:collapse}
.mtbl th{text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);border-bottom:1px solid var(--border);font-family:var(--font-h);font-weight:600}
.mtbl td{padding:9px 12px;border-bottom:1px solid rgba(38,38,66,0.6)}
.mtbl tr:hover td{background:var(--panel-h)}
.pcell{display:flex;align-items:center;gap:12px}
.pico-wrap{width:36px;height:36px;border-radius:8px;background:rgba(21,21,36,0.8);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pico-wrap svg{width:22px;height:22px}
.pn{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.pd{font-size:11px;color:var(--dim);margin-top:2px}
.cb{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-family:var(--font-h);font-weight:600;letter-spacing:.5px}
.ce{background:rgba(230,57,70,.15);color:var(--formula)}.cg{background:rgba(230,57,70,.1);color:#e88}
.ca{background:rgba(72,149,239,.15);color:var(--endurance)}.cs{background:rgba(87,204,153,.15);color:var(--rally)}
.cbr{background:rgba(255,149,0,.15);color:var(--touring)}.cel{background:rgba(255,214,10,.15);color:var(--drag)}
.cty{background:rgba(155,93,229,.15);color:var(--gt)}.cfu{background:rgba(200,200,200,.1);color:#aab}
.pc{font-family:var(--font-m);font-size:13px;font-weight:500}
.pu{color:var(--danger)}.pd2{color:var(--success)}.pn2{color:var(--text)}
.sn{font-family:var(--font-m);font-size:12px;color:var(--dim)}
.gtag{color:var(--warn);font-size:10px;font-weight:700;padding:2px 5px;background:rgba(255,149,0,0.12);border:1px solid rgba(255,149,0,0.3);border-radius:4px}
.bbuy{padding:6px 14px;border-radius:6px;background:rgba(87,204,153,.15);color:var(--success);border:1px solid rgba(87,204,153,.3);font-family:var(--font-h);font-size:12px;font-weight:700}
.bbuy:hover{background:var(--success);color:var(--bg)}
.bdis{padding:6px 14px;border-radius:6px;background:var(--panel);color:var(--muted);border:1px solid var(--border);font-family:var(--font-h);font-size:12px;font-weight:700;cursor:not-allowed}

/* GARAGE / WAREHOUSE */
.cstats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.sc{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;position:relative;overflow:hidden}
.sn2{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.sn2 svg{width:14px;height:14px}
.sv{font-family:var(--font-m);font-size:26px;font-weight:600;margin:4px 0}
.sb{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:6px}
.sf{height:100%;border-radius:3px;transition:width .4s}
.fspd{background:linear-gradient(90deg,var(--info),var(--endurance))}.frel{background:linear-gradient(90deg,var(--success),#2ecc71)}.faero{background:linear-gradient(90deg,var(--gt),var(--info))}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;transition:border-color .15s}
.pcard:hover{border-color:var(--border-h)}.pcard.gp{border-color:rgba(255,149,0,.4)}
.pct{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.pcn{font-family:var(--font-h);font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.cbar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin:8px 0}
.cfil{height:100%;border-radius:3px;transition:width .3s}
.cgood{background:var(--success)}.cok{background:var(--warn)}.cbad{background:var(--danger)}
.pst{display:flex;gap:12px;font-family:var(--font-m);font-size:11px;color:var(--dim);margin-bottom:10px}
.pacts{display:flex;gap:7px;align-items:center}
.bsm{padding:5px 12px;border-radius:6px;font-family:var(--font-h);font-size:11px;font-weight:700}
.bins{background:rgba(72,149,239,.15);color:var(--info);border:1px solid rgba(72,149,239,.3)}.bins:hover{background:var(--info);color:var(--bg)}
.buns{background:rgba(255,149,0,.15);color:var(--warn);border:1px solid rgba(255,149,0,.3)}.buns:hover{background:var(--warn);color:var(--bg)}
.bssp{background:rgba(87,204,153,.15);color:var(--success);border:1px solid rgba(87,204,153,.3)}.bssp:hover{background:var(--success);color:var(--bg)}

/* RACES */
.rhdr{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.rcp{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:15px}
.rlist{display:flex;flex-direction:column;gap:10px}
.rcard{display:flex;align-items:center;gap:14px;padding:14px;background:var(--panel);border:1px solid var(--border);border-radius:10px;transition:border-color .15s}
.rcard:hover{border-color:var(--border-h)}
.rdb{width:46px;height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.rdb svg{width:26px;height:26px}
.dform{background:rgba(230,57,70,.18);color:var(--formula)}.dend{background:rgba(72,149,239,.18);color:var(--endurance)}
.drally{background:rgba(87,204,153,.18);color:var(--rally)}.dtour{background:rgba(255,149,0,.18);color:var(--touring)}
.ddrag{background:rgba(255,214,10,.18);color:var(--drag)}.dgt{background:rgba(155,93,229,.18);color:var(--gt)}
.ri{flex:1}.rn{font-family:var(--font-h);font-size:16px;font-weight:700}.rdt{font-size:11px;color:var(--dim);margin-top:2px}
.rp{font-family:var(--font-m);font-size:15px;color:var(--success);font-weight:600}
.benter{padding:7px 16px;border-radius:7px;background:linear-gradient(135deg,var(--formula),#b51722);color:#fff;font-family:var(--font-h);font-size:12px;font-weight:700;letter-spacing:.5px}
.benter:hover{box-shadow:0 0 14px rgba(230,57,70,.4);transform:translateY(-1px)}
.rhist{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto}
.hrow{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--panel);border-radius:6px;border:1px solid var(--border)}
.pb{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-size:12px;font-weight:700}
.p1{background:var(--gold);color:#000}.p2{background:var(--silver);color:#000}.p3{background:var(--bronze);color:#000}.pdnf{background:var(--danger);color:#fff}.poth{background:var(--muted);color:var(--dim)}

/* TRAVEL / CITIES */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.cityc{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;transition:all .15s;position:relative}
.cityc:hover{border-color:var(--border-h);transform:translateY(-2px)}
.cityc.cur{border-color:var(--success);box-shadow:0 0 14px rgba(87,204,153,.15)}
.ctop{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.cflag{font-size:24px;line-height:1}
.cname{font-family:var(--font-h);font-size:16px;font-weight:700}.ccnt{font-size:11px;color:var(--dim)}
.cspec{font-size:11px;color:var(--dim);margin-bottom:8px;padding:3px 8px;background:var(--panel-h);border-radius:4px;display:inline-block}
.cprices{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.cpt{font-size:10px;padding:2px 6px;border-radius:4px}
.cheap{background:rgba(87,204,153,.1);color:var(--success)}.pricey{background:rgba(230,57,70,.1);color:var(--danger)}
.tcost{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--border)}
.tfee{font-family:var(--font-m);font-size:11px;color:var(--warn)}
.btrv{padding:5px 12px;border-radius:6px;background:rgba(255,214,10,.1);color:var(--drag);border:1px solid rgba(255,214,10,.3);font-family:var(--font-h);font-size:11px;font-weight:700}
.btrv:hover{background:var(--drag);color:var(--bg)}

/* FINANCE */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.fc{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:13px}
.fl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.fv{font-family:var(--font-m);font-size:22px;font-weight:600;margin-top:3px}
.fv.pos{color:var(--success)}.fv.neg{color:var(--danger)}.fv.wrn{color:var(--warn)}
.lrow{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.lrow.consd{border-color:rgba(230,57,70,0.5);background:rgba(230,57,70,0.04)}
.lname{font-family:var(--font-h);font-size:15px;font-weight:700}
.ldet{font-size:11px;color:var(--dim);margin-top:2px}
.lbal{font-family:var(--font-m);font-size:18px;font-weight:600;margin-left:auto}
.bbrw{padding:6px 14px;border-radius:6px;background:rgba(72,149,239,.15);color:var(--info);border:1px solid rgba(72,149,239,.3);font-family:var(--font-h);font-size:12px;font-weight:700}
.bbrw:hover{background:var(--info);color:var(--bg)}

/* MODAL */
#mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;backdrop-filter:blur(6px);align-items:center;justify-content:center}
#mo.open{display:flex}
#mb{background:var(--panel);border:1px solid var(--border-h);border-radius:16px;padding:24px;min-width:340px;max-width:500px;width:90%;box-shadow:0 0 50px rgba(0,0,0,.85)}
.mtt{font-family:var(--font-h);font-size:22px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.mbd{margin-bottom:16px;color:var(--dim);line-height:1.65;font-size:13px}
.mbd strong{color:var(--text)}
.mac{display:flex;gap:8px;justify-content:flex-end}
.mi{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 13px;color:var(--text);font-size:15px;margin-bottom:12px}
.mi:focus{border-color:var(--info)}
.bcon{padding:8px 20px;border-radius:8px;background:var(--success);color:var(--bg);font-family:var(--font-h);font-size:14px;font-weight:700;cursor:pointer}
.bcan{padding:8px 20px;border-radius:8px;background:var(--panel-h);color:var(--dim);border:1px solid var(--border);font-family:var(--font-h);font-size:14px;font-weight:700;cursor:pointer}

/* TOAST */
#tc{position:fixed;top:70px;right:16px;z-index:300;display:flex;flex-direction:column;gap:8px}
.toast{padding:10px 16px;border-radius:9px;font-size:12px;font-weight:500;border:1px solid;animation:tin .3s ease;max-width:320px;line-height:1.4}
.ts{background:rgba(87,204,153,.15);border-color:var(--success);color:var(--success)}
.tw{background:rgba(255,149,0,.15);border-color:var(--warn);color:var(--warn)}
.td{background:rgba(230,57,70,.15);border-color:var(--danger);color:var(--danger)}
.ti{background:rgba(72,149,239,.15);border-color:var(--info);color:var(--info)}
@keyframes tin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}

/* MISC */
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.rs{text-align:center;padding:12px;background:var(--surface);border-radius:8px}
.rv{font-family:var(--font-m);font-size:22px;font-weight:600}
.rl{font-size:10px;color:var(--dim);margin-top:2px}
.empty{text-align:center;padding:36px;color:var(--dim)}
.eico{width:42px;height:42px;margin:0 auto 10px;color:var(--dim);opacity:0.6}
.sep{height:1px;background:var(--border);margin:16px 0}
.ib{padding:11px 15px;border-radius:8px;background:rgba(72,149,239,.08);border:1px solid rgba(72,149,239,.25);font-size:12px;color:var(--dim);line-height:1.6;margin-bottom:14px}
.elog{max-height:240px;overflow-y:auto}
.lent{padding:7px 0;border-bottom:1px solid rgba(38,38,66,.5);font-size:12px;color:var(--dim)}
.lent .wt{font-family:var(--font-m);font-size:10px;color:var(--muted);margin-right:6px}
.lg{color:var(--success)}.lb{color:var(--danger)}.lev{color:var(--warn)}
@media(max-width:900px){
 #layout{flex-direction:column-reverse}
 #sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:6px;border-right:0;border-top:1px solid var(--border);gap:4px;align-items:center}
 .nb{padding:8px 10px;font-size:12px;white-space:nowrap;flex-shrink:0}
 #etb,#sidebar .bcan{margin:0 4px;white-space:nowrap;flex-shrink:0;padding:8px 10px}
 #content{padding:12px;min-height:0}
 #hdr{overflow-x:auto;gap:8px;padding:0 8px}
 .hstat{min-width:62px}.hright,#logo-text{display:none}
 .rhdr{grid-template-columns:1fr}.rcard{flex-wrap:wrap}
 .pgrid,.cgrid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
 #mb{min-width:0;width:94%;padding:16px;max-height:90vh;overflow:auto}
}
@media(max-width:520px){.hsep{display:none}.pgrid,.cgrid{grid-template-columns:1fr}.hero-banner{min-height:110px}.pt{font-size:17px}}

/* ════════ CLEAN-LINE SKIN ════════ */
:root{
  --bg:#0c0e12;--surface:#12151a;--panel:#171b21;--panel-h:#1e232b;
  --border:#272d36;--border-h:#3a424e;--text:#eceff3;--dim:#8a93a0;--muted:#333a45;
  --accent:#ff5c1a;--accent-dim:#b33d10;
  --formula:#ff5c1a;--endurance:#4c8dff;--rally:#2fbf71;--touring:#ffb020;--drag:#ffd200;--gt:#a06cff;
  --success:#2fbf71;--warn:#ffb020;--danger:#f0484f;--info:#4c8dff;
  --hdr:58px;--nav:186px;--ticker:32px;
}
*{border-radius:0 !important}
body{font-size:14px;letter-spacing:.1px}
.val,.hstat .val,#wk-badge,.rp,.pst,.cfil,td,th{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--border-h)}

/* header: a timing strip, not a glass bar */
#hdr{background:var(--surface);backdrop-filter:none;border-bottom:1px solid var(--border);height:var(--hdr);gap:0;padding:0}
#hdr::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:repeating-linear-gradient(90deg,var(--text) 0 10px,transparent 10px 20px);opacity:.14}
#logo-wrap{padding:0 16px;height:100%;align-items:center;border-right:1px solid var(--border);gap:12px}
#logo-badge{width:30px;height:30px;border:0;box-shadow:none;object-fit:contain;filter:saturate(1.1)}
#logo-title{background:none;-webkit-text-fill-color:var(--text);color:var(--text);font-size:16px;letter-spacing:2.4px;font-weight:700}
#logo-sub{color:var(--dim);letter-spacing:1.6px;font-size:9px}
.hsep{display:none}
.hstat{min-width:0;padding:0 18px;height:100%;justify-content:center;align-items:flex-start;border-right:1px solid var(--border)}
.hstat .lbl{letter-spacing:1.4px;font-size:9px;color:var(--dim)}
.hstat .val{font-size:16px;font-weight:500;margin-top:2px}
#city-badge{height:100%;padding:0 16px;background:transparent;border:0;border-right:1px solid var(--border);font-size:14px;letter-spacing:.6px;gap:9px}
#ap-bar{background:transparent;border:0;border-right:1px solid var(--border);height:100%;padding:0 16px;gap:4px}
.ap-pip{width:7px;height:16px;background:var(--muted);box-shadow:none}
.ap-pip.on{background:var(--accent);box-shadow:none}
#wk-badge{background:transparent;border:0;border-right:1px solid var(--border);height:100%;display:flex;align-items:center;padding:0 16px;color:var(--text);font-size:12px;letter-spacing:1px}
.hright{padding:0 18px}
.rep-track{height:4px;background:var(--muted);width:76px}
.rep-fill{background:var(--accent)}

/* sidebar: square tabs with an edge marker */
#sidebar{background:var(--surface);padding:0;gap:0}
.nb{border:0;border-left:3px solid transparent;border-bottom:1px solid var(--border);padding:13px 15px;letter-spacing:.9px;font-size:13px}
.nb:hover{background:var(--panel);color:var(--text)}
.nb.active{background:var(--panel-h);color:var(--text);border-left-color:var(--accent)}
#sidebar .bcan{border:1px solid var(--border);background:transparent;color:var(--dim);padding:9px 10px;letter-spacing:.4px}
#sidebar .bcan:hover{border-color:var(--border-h);color:var(--text);background:var(--panel)}
#etb{background:var(--accent);color:#120800;border:0;padding:13px;letter-spacing:1.6px;margin:10px}
#etb:hover{background:#ff7538;color:#120800;box-shadow:none}
#content{padding:24px 26px 30px}

/* panels and cards: flat, hairline, one coloured edge */
.pcard,.cityc,.rcard,.rcp,.ib,.hrow,#mb,.empty{background:var(--panel);border:1px solid var(--border);box-shadow:none}
.pcard{padding:14px;position:relative;border-top:2px solid var(--border-h)}
.pcard.ce,.pcard.gp{border-top-color:var(--accent)}
.pcard:hover,.cityc:hover,.rcard:hover{border-color:var(--border-h);background:var(--panel-h)}
.cityc.cur{border-color:var(--accent)}
.pgrid,.cgrid{gap:1px;background:var(--border);border:1px solid var(--border)}
.pgrid .pcard,.cgrid .cityc{border:0;border-top:2px solid transparent}
.pgrid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.ct{font-size:11px;letter-spacing:2px;color:var(--dim);border-bottom:1px solid var(--border);padding-bottom:7px;margin:22px 0 12px}
.sep{height:1px;background:var(--border);margin:26px 0}
.pt{font-size:20px;letter-spacing:.4px;font-weight:600}
.ps{color:var(--dim);font-size:12px}
.ph{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:18px}

/* buttons: square, hairline, one filled action */
.bsm,.btrv,.benter,.bcon,.bcan{border:1px solid var(--border-h);background:transparent;color:var(--text);padding:7px 12px;font-size:12px;letter-spacing:.5px}
.bsm:hover,.btrv:hover,.bcan:hover{background:var(--panel-h);border-color:var(--text)}
.benter,.bcon{background:var(--accent);border-color:var(--accent);color:#120800;font-weight:600}
.benter:hover,.bcon:hover{background:#ff7538;border-color:#ff7538}
.bins{border-color:var(--success);color:var(--success)}
.bins:hover{background:var(--success);color:#04130b}
.bssp{border-color:var(--info);color:var(--info)}
.bssp:hover{background:var(--info);color:#030a16}
.buns{border-color:var(--border-h);color:var(--dim)}
input.mi,select.mi{background:var(--surface);border:1px solid var(--border-h);color:var(--text);padding:9px 11px;width:100%;margin:5px 0 12px}
input.mi:focus,select.mi:focus{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hero: duotone image, hard edge, left rule */
.hero-banner{border:1px solid var(--border);min-height:132px;margin-bottom:20px;background:var(--panel)}
.hero-bg{filter:grayscale(1) contrast(1.15) brightness(.5);opacity:.55}
.hero-grad{background:linear-gradient(90deg,var(--panel) 12%,rgba(23,27,33,.72) 55%,rgba(23,27,33,.25))}
.hero-content{padding:20px 24px;border-left:3px solid var(--accent);margin-left:22px}
.hero-title{font-size:25px;letter-spacing:.4px;font-weight:700}
.hero-desc{color:var(--dim);max-width:62ch;line-height:1.55}
.hero-tag{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:3px 9px;letter-spacing:1.6px;font-size:10px}

/* market rows, badges, meters */
.cb,.gtag,.cpt,.rdb{border:1px solid currentColor;background:transparent;letter-spacing:.8px}
.cbar,.sb{height:4px;background:var(--muted)}
.cfil,.sf{box-shadow:none}
.cgood{background:var(--success)}.cok{background:var(--warn)}.cbad{background:var(--danger)}
.rdb{width:42px;height:42px;background:transparent}
.rp{font-size:17px;letter-spacing:.3px}
.pb{border:1px solid currentColor;background:transparent}
.toast{border:1px solid var(--border-h);background:var(--panel);box-shadow:none;border-left:3px solid var(--accent)}
.toast.ts{border-left-color:var(--success)}.toast.td{border-left-color:var(--danger)}.toast.tw{border-left-color:var(--warn)}
#mo{background:rgba(6,7,10,.78);backdrop-filter:blur(2px)}
#mb{border:1px solid var(--border-h);padding:22px}
.mtt{border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:14px;letter-spacing:.4px}
#ticker{background:var(--surface);border-top:1px solid var(--border)}
.tki{color:var(--dim);font-size:11px;letter-spacing:.6px}
.empty{color:var(--dim);border:1px dashed var(--border-h);padding:30px}

/* attribution strip */
#credit{position:fixed;right:10px;bottom:calc(var(--ticker) + 6px);font-size:10px;color:var(--dim);z-index:95;letter-spacing:.4px}
#credit a{color:var(--dim);text-decoration:underline}
/* responsive refinements for the clean-line skin */
@media(max-width:900px){
 #hdr{height:auto;min-height:52px}
 #logo-wrap{padding:0 10px}.hstat{padding:0 12px}
 .nb{border-bottom:0;border-left:0;border-top:3px solid transparent}
 .nb.active{border-left-color:transparent;border-top-color:var(--accent)}
 #etb{margin:0 6px}
 .pgrid,.cgrid{gap:1px}
 .hero-content{margin-left:12px;padding:16px}
 .hero-title{font-size:20px}
 #credit{display:none}
}

/* sortable market table + sell controls */
.mtbl th{cursor:pointer;user-select:none;white-space:nowrap}
.mtbl th:hover{color:var(--text)}
.mtbl th .sar{color:var(--accent);font-size:9px;margin-left:4px}
.mtbl th.sorted{color:var(--text)}
.mact{display:flex;gap:5px;align-items:center;justify-content:flex-end}
.bsell{border:1px solid var(--success);background:transparent;color:var(--success);padding:6px 9px;font-size:12px;letter-spacing:.4px}
.bsell:hover{background:var(--success);color:#04130b}
.bbuy,.bdis{padding:6px 11px;font-size:12px;letter-spacing:.4px}
</style>
</head>

function wcap(){return 30+G.rep*0.2+(F('hq')&&G.hq.store?20:0)+(F('logi')?(G.truck||0)*10:0);}
function wusd(){return G.wh.reduce((s,i)=>s+(PARTS[i.pid]?PARTS[i.pid].sl:1),0);}
function wval(){return G.wh.reduce((s,i)=>s+getSell(G.city,i.pid,i.cond),0);}
function tdebt(){return Object.values(G.loans).reduce((a,b)=>a+b,0);}

function carStats(){
  let spd=20,rel=50,aero=10;
  G.inst.forEach(it=>{
    const p=PARTS[it.pid];if(!p)return;
    const f=it.cond/100*(1+0.1*(it.lvl||0));
    spd+=p.spd*f;rel+=p.rel*f;aero+=p.aero*f;
  });
  const soft=v=>v>CFG.softCap?CFG.softCap+(v-CFG.softCap)*0.5:v;
  return{spd:Math.round(soft(spd)),rel:Math.max(10,Math.min(99,Math.round(rel))),aero:Math.round(soft(aero))};
}

function initPrices(){
  Object.keys(CITIES).forEach(cid=>{
    G.prices[cid]={};
    Object.keys(PARTS).forEach(pid=>{
      const p=PARTS[pid],m=CITIES[cid].mul[p.cat]||1;
      G.prices[cid][pid]=Math.round(p.base*m*(0.9+Math.random()*0.2));
    });
  });
}

function updatePrices(){
  Object.keys(CITIES).forEach(cid=>{
    Object.keys(PARTS).forEach(pid=>{
      const p=PARTS[pid],base=p.base*(CITIES[cid].mul[p.cat]||1);
      let cur=G.prices[cid][pid]||base;
      let target=base;
      G.events.forEach(ev=>{
        if(ev.cat===p.cat&&ev.catMul)target*=ev.catMul;
        if(ev.city===cid&&ev.cityMul)target*=ev.cityMul;
      });
      cur=cur+(target-cur)*0.25;
      cur=Math.round(cur*(0.92+Math.random()*0.16));
      G.prices[cid][pid]=Math.max(Math.round(base*0.35),Math.min(Math.round(base*2.4),cur));
    });
  });
}

function getPrice(cid,pid){return G.prices[cid]&&G.prices[cid][pid]?G.prices[cid][pid]:PARTS[pid].base;}
function getSell(cid,pid,cond=100){return Math.round(getPrice(cid,pid)*0.86*(cond/100)*(G.perk==='hustler'?1.05:1));}

function fireEvent(){
  const t=EVT_TEMPLATES[Math.floor(Math.random()*EVT_TEMPLATES.length)];
  const cats=['engine','gearbox','aero','suspension','brakes','electronics','tyres','fuel'];
  const cat=cats[Math.floor(Math.random()*cats.length)];
  const cids=Object.keys(CITIES),city=cids[Math.floor(Math.random()*cids.length)];
  const msg=t.msg.replace('{cat}',cat.toUpperCase()).replace('{city}',CITIES[city].n);
  const ev={msg,cat,city,catMul:t.catMul||1,cityMul:t.cityMul||1,dur:t.dur};
  G.events.push(ev);addLog('⚡ EVENT: '+msg,'ev');toast('⚡ '+msg,'w',5000);
}

function spendAP(cost=1){
  if(G.ap<cost){toast('Out of Action Points this week! Click END WEEK to advance.','w');return false;}
  G.ap-=cost;renderHeader();return true;
}

function buyPart(pid,qty=1){
  const p=PARTS[pid];qty=Math.floor(qty);
  if(!p||!(qty>=1)){toast('Enter a quantity of 1 or more','w');return;}
  if(p.grey&&!(G.greyOk&&CITIES[G.city].grey)){toast('No grey market in '+CITIES[G.city].n,'d');return;}
  if(wusd()+p.sl*qty>wcap()){toast('Warehouse full! Need '+(p.sl*qty)+' slots.','d');return;}
  const price=getPrice(G.city,pid),tot=bulkCost(price,qty),avg=Math.round(tot/qty);
  if(G.cash<tot){toast('Need '+fmt(tot)+' — you have '+fmt(G.cash),'d');return;}
  if(!spendAP(1))return;
  G.cash-=tot;G.prices[G.city][pid]=Math.round(price*Math.pow(1.04,qty));
  for(let i=0;i<qty;i++)G.wh.push({uid:uid(),pid,cond:100,bp:avg,bc:G.city,bw:G.week});
  addLog('Bought '+qty+'x '+p.name+' for '+fmt(tot)+' in '+CITIES[G.city].n,'g');
  toast('Purchased '+qty+'x '+p.name,'s');render();
}

function sellWh(iuid){
  const idx=G.wh.findIndex(i=>i.uid===iuid);if(idx<0)return;
  const it=G.wh[idx],sp=getSell(G.city,it.pid,it.cond);
  if(!spendAP(1))return;
  G.cash+=sp;const pl=sp-it.bp;G.wh.splice(idx,1);G.prices[G.city][it.pid]=Math.round(G.prices[G.city][it.pid]*0.95);
  const pls=pl>=0?'+'+fmt(pl):fmt(pl);
  addLog('Sold '+PARTS[it.pid].name+' for '+fmt(sp)+' ('+pls+') in '+CITIES[G.city].n,pl>=0?'g':'b');
  toast('Sold for '+fmt(sp)+' ('+pls+')',pl>=0?'s':'i');render();
}

function installPart(iuid){
  const idx=G.wh.findIndex(i=>i.uid===iuid);if(idx<0)return;
  const it=G.wh[idx];
  const slot=SLOT[it.pid],clash=G.inst.find(i=>SLOT[i.pid]===slot);
  if(clash){toast('Slot "'+slot+'" is taken by '+PARTS[clash.pid].name+' — uninstall it first','d');return;}
  G.wh.splice(idx,1);
  G.inst.push({...it,iw:G.week});
  toast('Installed '+PARTS[it.pid].name,'s');render();
}

function uninstall(iuid){
  const idx=G.inst.findIndex(i=>i.uid===iuid);if(idx<0)return;
  const it=G.inst[idx];G.inst.splice(idx,1);
  G.wh.push({...it,bp:it.bp||0,bc:it.bc||'',bw:it.bw||G.week});
  toast('Uninstalled '+PARTS[it.pid].name,'i');render();
}

function travelTo(cid){
  if(cid===G.city){toast('Already here!','i');return;}
  if(!spendAP(1))return;
  const fee=Math.round(CITIES[cid].tc*(F('logi')?1-0.1*(G.truck||0):1));
  if(G.cash<fee){G.ap++;toast('Need '+fmt(fee)+' to travel!','d');return;}
  G.cash-=fee;addLog('Travelled to '+CITIES[cid].n+' — cost '+fmt(fee),'');
  G.city=cid;arrivalChecks(cid);toast('Arrived in '+CITIES[cid].n+' '+CITIES[cid].f,'s');render();
}

function enterRace(race){
  if(G.banned>0){toast('Your driver is injured — no racing this week','d');return;}
  if(!raceRuns(race)){toast('Not running this week — next on week '+nextWk(race),'w');return;}
  if(G.raced>=CFG.racesPerWeek){toast('Only '+CFG.racesPerWeek+' race per week — End Week to race again','w');return;}
  const fee=Math.round(race.prize[0]*CFG.raceFeePct);
  if(G.cash<fee){toast('Entry fee is '+fmt(fee)+' — not enough cash','d');return;}
  if(!spendAP(1))return;
  G.cash-=fee;G.raced++;
  const greys=G.inst.filter(i=>PARTS[i.pid].grey);
  if(greys.length&&Math.random()<CFG.fiaChance*(F('customs')?0.5:1)){
    const g=greys[0],pp=PARTS[g.pid],fine=Math.round(pp.base*0.3);
    G.inst.splice(G.inst.indexOf(g),1);G.cash-=fine;G.rep=Math.max(0,G.rep-15);G.dnfWk=true;
    G.opt=null;postRace('DNF');G.raceHist.unshift({wk:G.week,n:race.n,d:race.disc,pos:'DNF',prize:0,pts:0});if(G.raceHist.length>12)G.raceHist.pop();
    addLog('🚨 FIA scrutineering: '+pp.name+' confiscated, DSQ, fine '+fmt(fine),'b');
    openModal('🚨 Disqualified','<p>Scrutineers found the illegal '+pp.name+'. Part confiscated, fine '+fmt(fine)+', −15 reputation, no prize.</p>',[]);render();return;
  }
  const st=carStats();
  const pf=perfScore(race);G.opt=null;
  if(Math.random()<Math.max(0.02,(100-pf.rel)*0.0045)){
    G.dnfWk=true;postRace('DNF');wearParts(28);G.raceHist.unshift({wk:G.week,n:race.n,d:race.disc,pos:'DNF',prize:0,pts:0});if(G.raceHist.length>12)G.raceHist.pop();addLog('DNF in '+race.n+' — mechanical failure!','b');
    showRaceResult(race,{pos:'DNF',prize:0,pts:0});render();return;
  }
  const ps=pf.score+(Math.random()-0.5)*30;
  const rs=race.rival+rivalAdj()+(Math.random()-0.5)*28;
  const diff=ps-rs;
  let pos;
  if(diff>18)pos=1;else if(diff>8)pos=2;else if(diff>0)pos=3;
  else if(diff>-10)pos=4;else if(diff>-20)pos=6;else pos=10;
  const prize=Math.round((race.prize[Math.min(pos-1,race.prize.length-1)]||0)*(1+Math.min(0.4,CFG.prizeGrowth*(G.season-1))));
  const pts=[25,18,15,12,10,8,6,4,2,1][pos-1]||1;
  G.cash+=prize;G.champ.pts+=pts;postRace(pos);
  if(pos===1){G.champ.wins++;if(!G.greyOk){G.greyOk=true;toast('🔓 Grey Market Unlocked — first race victory!','w',5000);}}
  G.rep=Math.min(100,G.rep+(pos<=3?8:pos<=6?3:-2));
  wearParts(pos<=3?10:pos<=6?14:20);
  G.raceHist.unshift({wk:G.week,n:race.n,d:race.disc,pos,prize,pts});
  if(G.raceHist.length>12)G.raceHist.pop();
  addLog('P'+pos+' in '+race.n+' · Prize: '+fmt(prize),'g');
  showRaceResult(race,{pos,prize,pts});render();
}

function repairPart(iuid){
  const it=G.inst.find(i=>i.uid===iuid);if(!it)return;
  const mx=it.max??100;
  if(it.cond>=mx){toast('Already at its maximum condition ('+mx+'%)','i');return;}
  const cost=repairCost(it);
  if(G.cash<cost){toast('Repair costs '+fmt(cost),'d');return;}
  if(!spendAP(1))return;
  G.cash-=cost;it.cond=mx;it.max=Math.max(40,mx-mechLoss());
  addLog('Repaired '+PARTS[it.pid].name+' for '+fmt(cost)+' (max condition now '+it.max+'%)','');
  toast('Repaired '+PARTS[it.pid].name,'s');render();
}

function sellStack(pid){
  const items=G.wh.filter(i=>i.pid===pid);if(!items.length)return;
  if(!spendAP(1))return;
  let tot=0,pl=0;
  let f=1;items.forEach(it=>{const sp=Math.round(getSell(G.city,pid,it.cond)*f);f*=0.95;tot+=sp;pl+=sp-(it.bp||0);});G.prices[G.city][pid]=Math.round(G.prices[G.city][pid]*f);
  G.cash+=tot;G.wh=G.wh.filter(i=>i.pid!==pid);
  addLog('Sold '+items.length+'x '+PARTS[pid].name+' for '+fmt(tot)+' ('+(pl>=0?'+':'')+fmt(pl)+')',pl>=0?'g':'b');
  toast('Sold '+items.length+' for '+fmt(tot),pl>=0?'s':'i');render();
}

const DRIVERS=[{id:'rookie',n:'Local Rookie',skill:35,wage:0},{id:'club',n:'Club Racer',skill:55,wage:600},{id:'pro',n:'Pro Driver',skill:72,wage:1800},{id:'star',n:'Star Driver',skill:88,wage:4500}];
const ALLRACES=Object.values(RACES).flat();
function driver(){return DRIVERS.find(d=>d.id===G.driver)||DRIVERS[0];}
function sponsorTier(){return G.rep>=85?{n:'Global Sponsor',pay:4500}:G.rep>=70?{n:'Regional Sponsor',pay:1800}:G.rep>=55?{n:'Local Sponsor',pay:700}:null;}
function titlePts(){return titleNeed(G.season);}
function raceOff(r){return ALLRACES.findIndex(x=>x.id===r.id)%CFG.raceEvery;}
function raceRuns(r){return (G.week-1)%CFG.raceEvery===raceOff(r);}
function nextWk(r){const w=G.week+((raceOff(r)-(G.week-1)%CFG.raceEvery)+CFG.raceEvery)%CFG.raceEvery;return w>SL()?(w-SL())+' (next season)':w;}
function hireDriver(id){const d=DRIVERS.find(x=>x.id===id);if(!d)return;noteWage();G.driver=id;noteWage();toast('Signed '+d.n,'s');render();}
function renderDrivers(){
  const t=sponsorTier();
  document.getElementById('tab-garage').insertAdjacentHTML('beforeend',`<div class="sep"></div><div class="ct">Driver &amp; Sponsor</div>
  <div style="font-size:12px;color:var(--dim);margin-bottom:8px">Sponsor: ${t?t.n+' pays '+fmt(t.pay)+'/wk (nothing after a DNF week)':'none yet — reach reputation 55'}</div>
  <div class="pgrid">${DRIVERS.map(d=>`<div class="pcard"><div class="pcn">${d.n}</div><div class="pst"><span>Skill ${d.skill}${F('traits')&&TRAIT_OF[d.id]?' · '+TRAITS[TRAIT_OF[d.id]]:''}</span><span>Wage ${fmt(d.wage)}/wk</span></div><div class="pacts">${G.driver===d.id?'<span style="font-size:11px;color:var(--success)">✓ Signed</span>':`<button class="bsm bins" onclick="hireDriver('${d.id}')">Sign</button>`}</div></div>`).join('')}</div>`);
}
function seasonEnd(n){
  const need=titleNeed(n),pts=G.champ.pts,won=pts>=need;
  if(won){G.titles++;G.rep=Math.min(100,G.rep+10);}
  G.champ={pts:0,wins:G.champ.wins};
  addLog((won?'🏆 Season '+n+' CHAMPIONS':'Season '+n+' ended without the title')+' — '+pts+'/'+need+' pts','ev');
  const victory=G.mode==='career'&&G.titles>=CFG.careerTitles&&!G.won;
  if(victory)G.won=true;
  if(!G.league)openModal(won?'🏆 Season '+n+' Champions!':'Season '+n+' complete',
    '<p>Points: <strong>'+pts+' / '+need+'</strong> needed for the title.</p><p style="margin-top:8px">Titles won: <strong>'+G.titles+'</strong>'+(G.mode==='career'?' / '+CFG.careerTitles:'')+'</p>'+(victory?'<p style="margin-top:10px;color:var(--gold)">🎉 CAREER COMPLETE — you are a motorsport legend! Press Endless to keep playing, or Cancel to continue as is.</p>':''),
    victory?[{l:'♾ Endless',fn:()=>{G.mode='endless';render();},c:'bcon'}]:[]);
}
const STAFF={mech:[{n:'Junior Mechanic',wage:500,disc:0.25,loss:4},{n:'Senior Mechanic',wage:1500,disc:0.5,loss:2}],eng:[{n:'Junior Engineer',wage:700,bonus:3},{n:'Senior Engineer',wage:2000,bonus:7}]};
function stf(k){const l=(G.staff&&G.staff[k])||0;return l?STAFF[k][l-1]:null;}
function mechDisc(){const m=stf('mech');return (m?m.disc:0)+(G.perk==='mechanic'?0.2:0);}
function mechLoss(){const m=stf('mech');return m?m.loss:CFG.repairMaxLoss;}
function staffWage(){return Math.round(['mech','eng'].reduce((a,k)=>a+(stf(k)?stf(k).wage:0),0)*(F('hq')&&G.hq.scout?0.8:1));}
function repairCost(it){return Math.round(PARTS[it.pid].base*CFG.repairPct*((it.max??100)-it.cond)/100*(1-mechDisc()));}
function bulkCost(price,q){return Math.round(price*(Math.pow(1.04,q)-1)/0.04*(G.perk==='negotiator'?0.94:1));}
function setStaff(k,l){noteWage();G.staff[k]=l;noteWage();render();}
// Wages are owed for the most expensive line-up held at any point this week, so signing a star for one race and releasing them before End Week doesn't skip the bill.
function noteWage(){G.wkWage=Math.max(G.wkWage||0,driver().wage+staffWage());}
function wageDue(){return Math.max(G.wkWage||0,driver().wage+staffWage());}
function loanInt(l){return G.loans[l]>0?Math.round(G.loans[l]*LENDERS[l].rate*DF().loan*(G.perk==='banker'?0.6:1)):0;}
function weekCost(){const w=wageDue(),i=Object.keys(LENDERS).reduce((s,l)=>s+loanInt(l),0);return{wages:w,int:i,tot:G.wkBase+w+i};}
function upgradePart(iuid){
  const it=G.inst.find(i=>i.uid===iuid);if(!it)return;const lv=it.lvl||0;
  if(lv>=3){toast('Already at max upgrade level','i');return;}
  const cost=Math.round(PARTS[it.pid].base*0.2*(lv+1));
  if(G.cash<cost){toast('Upgrade costs '+fmt(cost),'d');return;}
  if(!spendAP(1))return;
  G.cash-=cost;it.lvl=lv+1;addLog('R&D: '+PARTS[it.pid].name+' upgraded to Lv '+it.lvl+' for '+fmt(cost),'g');
  toast(PARTS[it.pid].name+' → Lv '+it.lvl+' (+'+it.lvl*10+'% stats)','s');render();
}
function renderStaff(){
  const row=(k,lab)=>`<div class="pcard"><div class="pcn">${lab}</div><div class="pst"><span>${stf(k)?stf(k).n+' · '+fmt(stf(k).wage)+'/wk':'Not hired'}</span></div><div class="pacts">${[0,1,2].map(l=>G.staff[k]===l?`<span style="font-size:11px;color:var(--success)">✓ ${l?STAFF[k][l-1].n.split(' ')[0]:'None'}</span>`:`<button class="bsm bins" onclick="setStaff('${k}',${l})">${l?STAFF[k][l-1].n.split(' ')[0]+' '+fmt(STAFF[k][l-1].wage)+'/wk':'Fire'}</button>`).join('')}</div></div>`;
  document.getElementById('tab-garage').insertAdjacentHTML('beforeend',`<div class="sep"></div><div class="ct">Staff</div><div class="pgrid">${row('mech','🔧 Mechanic — cheaper repairs, slower wear')}${row('eng','📐 Engineer — better setup, more pace')}</div>`);
}
const PERKS={negotiator:{n:'Negotiator',d:'buys cost 6% less'},hustler:{n:'Hustler',d:'sells for 5% more'},banker:{n:'Banker',d:'−40% loan interest, +$5,000'},celebrity:{n:'Celebrity',d:'+15 starting reputation'},mechanic:{n:'Mechanic\'s kid',d:'repairs 20% cheaper'},lucky:{n:'Lucky',d:'half as many disasters'}};
const DIFF={easy:{cash:22000,rival:-6,dis:0.06,loan:0.7},normal:{cash:15000,rival:0,dis:0.12,loan:1},hard:{cash:9000,rival:7,dis:0.16,loan:1.2}};
const PERS=['wkWage','cash','rep','city','wh','inst','loans','consMiss','wkBase','greyOk','raceHist','champ','log','ap','raced','titles','won','driver','dnfWk','staff','perk','name','team','banned','dead','lrep','vault','truck','hq','dxp'];
const DISASTERS=[
 {n:'🔥 Garage fire',d:'Every installed part loses 25% condition.',f:()=>G.inst.forEach(i=>i.cond=Math.max(5,i.cond-25))},
 {n:'🧾 Tax audit',d:'You are fined 6% of your cash (min $500).',f:()=>{G.cash-=Math.max(500,Math.round(Math.max(0,G.cash)*0.06));}},
 {n:'🤕 Driver injured',d:'Your driver cannot race next week.',f:()=>{G.banned=1;}},
 {n:'🦹 Warehouse theft',d:'A part vanished from storage.',f:()=>{if(G.wh.length)G.wh.splice(Math.floor(Math.random()*G.wh.length),1);}},
 {n:'📉 Sponsor scandal',d:'Bad press: −8 reputation.',f:()=>{G.rep=Math.max(0,G.rep-8);}},
 {n:'🛠 Safety recall',d:'A random installed part is capped at 30% condition.',f:()=>{if(G.inst.length){const i=G.inst[Math.floor(Math.random()*G.inst.length)];i.cond=Math.min(i.cond,30);}}},
 {n:'🍀 Windfall',d:'A distant relative leaves you $5,000.',f:()=>{G.cash+=5000;}}
];
function disaster(){
  if(Math.random()>=DF().dis*(G.perk==='lucky'?0.5:1))return;
  const e=DISASTERS[Math.floor(Math.random()*DISASTERS.length)];e.f();
  addLog(e.n+' — '+e.d,'b');toast(e.n+' '+e.d,'d',7000);
  if(!G.league)openModal(e.n,'<p>'+e.d+'</p>',[]);
}
function noSeason(){return !G.settings.seasonLen;}
function SL(){return G.settings.seasonLen||9999;}
function slLabel(){return noSeason()?'no season end':'week '+G.week+'/'+SL();}
function rivalAdj(){return Math.min(CFG.rivalCap,(G.season-1)*CFG.rivalSeasonBoost)+DF().rival;}
function titleNeed(n){return noSeason()?Infinity:Math.round((SL()/CFG.raceEvery)*25*0.42)+(n-1)*CFG.titleStep;}
function nw(p){return p.cash+(p.vault||0)+p.wh.reduce((a,i)=>a+Math.round(getPrice(p.city,i.pid)*0.82*(i.cond/100)),0)-Object.values(p.loans).reduce((a,b)=>a+b,0);}
function stash(){if(G.league){const o={};PERS.forEach(k=>o[k]=G[k]);G.players[G.cur]=o;}}
function loadP(i){PERS.forEach(k=>G[k]=G.players[i][k]);G.cur=i;}
function newPlayer(name,team,perk){
  const d=DF();
  return{cash:d.cash+(perk==='banker'?5000:0)+(F('debt')?8000:0),rep:50+(perk==='celebrity'?15:0),city:'portimao',wh:[],
    inst:[{uid:uid(),pid:'suspension_road',cond:45,bp:7500,bc:'portimao',bw:0},{uid:uid(),pid:'turbo',cond:55,bp:13500,bc:'portimao',bw:0}],
    loans:{bank:F('debt')?8000:0,angel:0,consortium:0},consMiss:0,wkBase:350,greyOk:false,raceHist:[],champ:{pts:0,wins:0},log:[],ap:5,raced:0,titles:0,won:false,driver:'rookie',dnfWk:false,staff:{mech:0,eng:0},perk:perk||'',name,team,banned:0,dead:false,lrep:{},vault:0,truck:0,hq:{},dxp:0};
}
function beginGame(c){
  G.mode=c.len?c.mode:'endless';G.settings={seasonLen:+c.len||0,diff:DIFF[c.diff]?c.diff:'normal',feat:c.feat||{}};G.reg='';G.ai=[];if(F('rivals'))ensureAI();G.week=1;G.season=1;G.events=[];G.contracts=[];G.prices={};
  G.league=c.players.length>1;G.players=c.players.map(p=>newPlayer(p.name,p.team,p.perk));G.cur=0;loadP(0);
  initPrices();rollWeather();genContracts();G.tab='market';
  addLog('Welcome, '+G.name+'! '+G.team+' HQ opened in Portimão 🇵🇹'+(G.league?' — league of '+G.players.length+' managers':''),'');
  render();
}
function setupPlayers(){
  const n=+document.getElementById('wn').value;let h='';
  for(let i=0;i<n;i++)h+=`<div style="margin:8px 0;padding:8px;border:1px solid var(--border);border-radius:8px"><div style="font-size:11px;color:var(--dim)">${n>1?'Player '+(i+1):'Manager'}</div><input class="mi" id="pn${i}" placeholder="Manager name" maxlength="16"><input class="mi" id="pt${i}" placeholder="Team name" maxlength="20"><select class="mi" id="pp${i}">${Object.entries(PERKS).map(([k,v])=>`<option value="${k}">${v.n} — ${v.d}</option>`).join('')}</select></div>`;
  document.getElementById('wp').innerHTML=h;

function deliverContract(cid){

  addLog('📦 Contract delivered: '+c.qty+'x '+PARTS[c.pid].name+' → '+fmt(c.reward)+' (+3 rep)','g');

function rollWeather(){
  G.wx={};
  Object.values(RACES).flat().forEach(r=>{G.wx[r.id]=(r.disc!=='drag'&&Math.random()<(r.wet??0.25))?'wet':'dry';});
}

function perfScore(race){
  const st=carStats(),d=DISC[race.disc]||DISC.formula,wx=G.wx[race.id]||'dry';
  let sc=st.spd*d.spd+st.aero*d.aero+(driverSkill()-50)*0.5+(stf('eng')?stf('eng').bonus:0)+extraPace(race,st,d,wx);
  G.inst.forEach(it=>{sc+=(d.fit[it.pid]||0)*(it.cond/100);});
  const tyre=G.inst.find(i=>SLOT[i.pid]==='tyres');
  if(wx==='wet')sc+=(tyre&&tyre.pid==='tyres_wet')?10:-12;
  else if(tyre&&tyre.pid==='tyres_wet')sc-=8;
  return{score:sc,rel:Math.max(5,Math.min(99,st.rel+d.rel+Math.round((driverSkill()-50)*0.1)+extraRel())),wx};
}

function wearParts(amt){
  G.inst.forEach(it=>{it.cond=Math.max(0,Math.round(it.cond-(amt+(Math.random()-0.5)*10)));});
  const dead=G.inst.filter(i=>i.cond===0);
  dead.forEach(i=>{G.inst.splice(G.inst.indexOf(i),1);addLog(PARTS[i.pid].name+' destroyed!','b');});
}

function takeLoan(lid,amt){
  amt=Math.round(amt);if(!(amt>0)){toast('Enter an amount above $0','w');return;}
  if(!spendAP(1))return;
  const info=LENDERS[lid];
  if(lid!=='consortium'&&G.loans[lid]+amt>info.limit){G.ap++;toast('Exceeds '+info.name+' limit!','d');return;}
  G.cash+=amt;G.loans[lid]+=amt;
  addLog('Borrowed '+fmt(amt)+' from '+info.name,'');toast('Received '+fmt(amt),'i');render();
}

function repayLoan(lid,amt){
  amt=Math.min(Math.round(amt),G.loans[lid]);
  if(amt<=0||G.cash<amt){toast('Not enough cash!','d');return;}
  G.cash-=amt;G.loans[lid]-=amt;
  addLog('Repaid '+fmt(amt)+' to '+LENDERS[lid].name,'g');toast('Repaid '+fmt(amt),'s');render();
}

function playerWeek(){
  if(F('vault')&&G.vault>0)G.vault+=Math.round(G.vault*0.0012);
  Object.keys(LENDERS).forEach(l=>{G.loans[l]+=loanInt(l);});
  G.cash-=G.wkBase+wageDue();G.wkWage=0;
  const spn=G.dnfWk?0:(sponsorTier()?sponsorTier().pay:0);if(spn){G.cash+=spn;addLog('Sponsor paid '+fmt(spn),'g');}G.dnfWk=false;
  if(G.loans.consortium>0&&G.cash<0){
    G.consMiss++;addLog('⚠ Missed Consortium payment!','b');toast('⚠ Missed Consortium payment!','d');
    if(G.consMiss>=2){
      G.consMiss=0;const n=Math.ceil(G.wh.length*0.35);G.wh.splice(0,n);
      toast('🚨 CONSORTIUM RAID — '+n+' parts seized!','d',6000);addLog('🚨 CONSORTIUM RAID — '+n+' parts seized!','b');
    }
  }else{G.consMiss=0;}
  if(G.cash+(G.vault||0)+wval()-tdebt()<-50000){
    if(G.league){G.dead=true;G.wh=[];G.ap=0;addLog('💀 Bankrupt','b');toast('💀 '+G.name+' went bankrupt','d',6000);return true;}
    openModal('💀 Bankruptcy','<p>Your debts have overwhelmed you. The creditors have taken everything.</p>',[{l:'New game',fn:()=>{clearSave();location.reload();},c:'bcon'}]);return false;
  }
  if(G.banned>0)G.banned--;
  disaster();G.ap=5;G.raced=0;
  return true;
}

function worldWeek(){
  updatePrices();
  G.events=G.events.filter(e=>{e.dur--;return e.dur>0;});
  if(Math.random()<0.3)fireEvent();
  rollWeather();if(F('rivals'))aiWeek();G.week++;
  G.contracts=G.contracts.filter(c=>c.due>=absWk());if(genContracts())toast('📦 New delivery contracts available','i');
  let o=0;if(G.week>SL()){o=G.season;G.week=1;G.season++;newReg();(G.ai||[]).forEach(a=>a.pts=0);}
  addLog('--- Week '+G.week+' begins ---','');return o;
}
function endWeek(){
  if(!G.league){if(!playerWeek())return;const o=worldWeek();if(o)seasonEnd(o);render();return;}
  stash();
  for(let i=0;i<G.players.length;i++){loadP(i);if(!G.dead)playerWeek();stash();}
  const o=worldWeek();
  if(o){for(let i=0;i<G.players.length;i++){loadP(i);if(!G.dead)seasonEnd(o);stash();}toast('🏁 Season '+o+' finished — see 👥 League','w',7000);}
  loadP(0);render();
}

function mSort(k){if(G.msort===k)G.mdesc=!G.mdesc;else{G.msort=k;G.mdesc=(k!=='name'&&k!=='cat');}renderMarket();}
function mKey(p,k){
  const price=getPrice(G.city,p.id),base=p.base*(CITIES[G.city].mul[p.cat]||1);
  const own=G.wh.filter(i=>i.pid===p.id);
  switch(k){
    case 'name':return p.name.toLowerCase();
    case 'cat':return p.cat;
    case 'buy':return price;
    case 'diff':return (price-base)/base;
    case 'sell':return getSell(G.city,p.id,100);
    case 'own':return own.length;
    case 'profit':return own.length?own.reduce((a,i)=>a+(getSell(G.city,i.pid,i.cond)-(i.bp||0)),0):-Infinity;
    default:return 0;
  }
}
function mSorted(parts){
  const k=G.msort||'name',d=G.mdesc?-1:1;
  return parts.slice().sort((a,b)=>{const x=mKey(a,k),y=mKey(b,k);
    return (typeof x==='string'?x.localeCompare(y):(x-y))*d||a.name.localeCompare(b.name);});
}
function mHead(){
  const cols=[['name','Part'],['cat','Category'],['buy','Buy price'],['diff','vs base'],['sell','Sell price'],['own','In store'],['profit','Unrealised P/L'],['',"Trade"]];
  return cols.map(([k,l])=>k?`<th class="${G.msort===k?'sorted':''}" onclick="mSort('${k}')">${l}${G.msort===k?`<span class="sar">${G.mdesc?'▼':'▲'}</span>`:''}</th>`:`<th>${l}</th>`).join('');
}
function sellOne(pid){
  const items=G.wh.filter(i=>i.pid===pid);if(!items.length){toast('None in store','w');return;}
  const worst=items.slice().sort((a,b)=>a.cond-b.cond)[0];
  sellWh(worst.uid);
}
function showSell(pid){
  const items=G.wh.filter(i=>i.pid===pid);if(!items.length){toast('None in store','w');return;}
  const p=PARTS[pid],sorted=items.slice().sort((a,b)=>a.cond-b.cond);
  const line=q=>{let t=0,f=1;sorted.slice(0,q).forEach(i=>{t+=Math.round(getSell(G.city,pid,i.cond)*f);f*=0.95;});return t;};
  const cost=q=>sorted.slice(0,q).reduce((a,i)=>a+(i.bp||0),0);
  openModal(`Sell ${p.name}`,`
    <div style="font-size:12px;color:var(--dim);margin-bottom:10px">Selling in ${CITIES[G.city].f} ${CITIES[G.city].n}. Worst condition goes first; each unit sold drops the local price about 5%.</div>
    <div style="font-size:12px;margin-bottom:10px">In store: <strong>${items.length}</strong> · conditions ${sorted.map(i=>i.cond+'%').join(', ')}</div>
    <label style="font-size:11px;color:var(--dim)">How many to sell</label>
    <input type="number" class="mi" id="sqty" value="1" min="1" max="${items.length}">
    <div id="stot" style="font-family:var(--font-m);font-size:15px">Total ${fmt(line(1))} · P/L ${line(1)-cost(1)>=0?'+':''}${fmt(line(1)-cost(1))}</div>`,
    [{l:'Sell',c:'bcon',fn:()=>{const q=Math.min(items.length,Math.max(1,parseInt(document.getElementById('sqty').value)||1));sellQty(pid,q);}}]);
  const inp=document.getElementById('sqty');
  inp.oninput=function(){const q=Math.min(items.length,Math.max(1,parseInt(this.value)||1));
    document.getElementById('stot').textContent=`Total ${fmt(line(q))} · P/L ${line(q)-cost(q)>=0?'+':''}${fmt(line(q)-cost(q))}`;};
}
function sellQty(pid,q){
  const items=G.wh.filter(i=>i.pid===pid).sort((a,b)=>a.cond-b.cond).slice(0,q);
  if(!items.length)return;
  if(!spendAP(1))return;
  let tot=0,pl=0,f=1;
  items.forEach(it=>{const sp=Math.round(getSell(G.city,pid,it.cond)*f);f*=0.95;tot+=sp;pl+=sp-(it.bp||0);G.wh.splice(G.wh.indexOf(it),1);});
  G.prices[G.city][pid]=Math.round(G.prices[G.city][pid]*f);
  G.cash+=tot;
  addLog('Sold '+items.length+'x '+PARTS[pid].name+' for '+fmt(tot)+' ('+(pl>=0?'+':'')+fmt(pl)+') in '+CITIES[G.city].n,pl>=0?'g':'b');
  toast('Sold '+items.length+' for '+fmt(tot)+' ('+(pl>=0?'+':'')+fmt(pl)+')',pl>=0?'s':'i');render();
}

function renderTicker(){
  const its=[];
  Object.values(PARTS).filter(p=>!p.grey).slice(0,5).forEach(p=>{
    const price=getPrice(G.city,p.id),base=p.base*(CITIES[G.city].mul[p.cat]||1),diff=price-base,dp=Math.round((diff/base)*100);
    its.push(`<span class="tki ${diff>0?'dn':'up'}">${CITIES[G.city].f} ${p.name}: ${fmt(price)} ${diff>=0?'▲':'▼'}${Math.abs(dp)}%</span>`);
  });
  G.events.forEach(ev=>its.push(`<span class="tki ev">⚡ ${ev.msg}</span>`));
  if(G.raceHist.length>0){const l=G.raceHist[0];its.push(`<span class="tki">🏁 Last Race: ${l.n} — ${l.pos==='DNF'?'DNF':'P'+l.pos} ${fmt(l.prize)}</span>`);}
  if(G.cash<0)its.push(`<span class="tki" style="color:var(--danger)">⚠ NEGATIVE BALANCE — repay loans!</span>`);
  if(G.greyOk)its.push(`<span class="tki" style="color:var(--warn)">🔓 Grey market unlocked</span>`);
  const dbl=[...its,...its];
  document.getElementById('tki').innerHTML=dbl.join('');
}

function enterRaceById(rid,cid){const races=RACES[cid]||[];const race=races.find(r=>r.id===rid);if(race)preRace(race);}

function saveGame(){try{localStorage.setItem(CFG.saveKey,JSON.stringify(G));}catch(e){}}
function loadGame(){try{const t=localStorage.getItem(CFG.saveKey);if(!t)return false;const d=JSON.parse(t);if(!d||!d.prices||!d.city)return false;Object.assign(G,d);if(!G.wx||!Object.keys(G.wx).length)rollWeather();if(!G.contracts)G.contracts=[];genContracts();return true;}catch(e){return false;}}
function clearSave(){try{localStorage.removeItem(CFG.saveKey);}catch(e){}}
function newGame(){if(confirm('Start a new game? Current progress will be lost.')){clearSave();location.reload();}}

function render(){
  saveGame();
  if(G.league&&G.ap<=0&&!document.getElementById('mo').classList.contains('open')){queuePass();}
  renderHeader();renderTicker();
  if(G.tab==='market'){renderMarket();renderContracts();}
  else if(G.tab==='garage'){renderGarage();renderDrivers();renderStaff();renderHQ();}
  else if(G.tab==='warehouse')renderWarehouse();
  else if(G.tab==='finance'){renderFinance();renderVault();}
  else if(G.tab==='race')renderRace();
  else if(G.tab==='travel')renderTravel();
}

// ══════════ EVENT LISTENERS ══════════
document.querySelectorAll('.nb').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tp').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');G.tab=btn.dataset.tab;
    document.getElementById('tab-'+G.tab).classList.add('active');render();
  });
});

document.getElementById('etb').addEventListener('click',()=>{
  if(G.league){openModal('End your turn?','<p>Your remaining Action Points will be forfeited.</p>',[{l:'End Turn',fn:()=>{G.ap=0;render();},c:'bcon'}]);return;}
  const wc=weekCost();
  openModal('⏩ Advance to Week '+(G.week+1),`<div style="line-height:1.8">Pending weekly costs:<br>• Base operations: <strong>${fmt(G.wkBase)}</strong><br>• Driver &amp; staff wages: <strong>${fmt(wc.wages)}</strong><br>• Loan interest (added to debt): <strong>${fmt(wc.int)}</strong><br><br>Global markets will fluctuate. New events may trigger.<br>You will be credited with <strong>5 fresh Action Points</strong>.</div>`,[{l:'Advance Week',fn:endWeek,c:'bcon'}]);
});

document.getElementById('mo').addEventListener('click',e=>{if(e.target===document.getElementById('mo')&&!G.forced)closeModal();});

// ══════════ INIT ══════════
const loaded=loadGame();
if(!loaded){const df={};FEATS.forEach(f=>df[f[0]]=true);beginGame({mode:'career',diff:'normal',len:30,players:[{name:'Manager',team:'Your Team',perk:''}],feat:df});}
G.tab='market';resumeForced();render();
if(!loaded)showSetup();
</script>
